[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xernel-cli"
dynamic = ["version"]
description = "A minimal, extensible terminal interface for development."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
[project.scripts]
xernel = "xernel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { file = ["src/xernel/VERSION"] }

[tool.setuptools.package-data]
xernel = ["VERSION"]

[tool.pytest.ini_options]
testpaths = ["tests"]

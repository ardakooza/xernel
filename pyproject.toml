[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xernel-cli"
version = "0.1.0"
description = "A minimal, extensible terminal interface for development."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "rich>=13.7", "prompt-toolkit>=3.0"]

[project.scripts]
xernel = "xernel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
